// Firefox Agent Bridge (installed by firefox-agent-bridge/install.sh, removed by uninstall.sh).
//
// Opens Firefox's own remote control server (WebDriver BiDi on localhost:9222,
// started the "not browser automation" way, so pages keep navigator.webdriver
// false) only while a Claude Code session is using the bridge. That lets the
// bridge send real (isTrusted) input like Claude in Chrome does.
//
// "In use" = a marker file $XDG_RUNTIME_DIR/firefox-agent-bridge/active/<pid> written
// by the bridge's MCP server, whose process is alive and which it touched in
// the last 2 minutes. Checked every 2 seconds. Kept short because Firefox
// shows its remote-control cue (striped address bar) while the server is up.
//
// defaultPref() only changes defaults, so nothing is written to prefs.js and
// removing this file leaves the profile as it was.
try {
  defaultPref("remote.experimental.dynamicstart.enabled", true);
  defaultPref("remote.experimental.dynamicstart.prompt.enabled", false);
  defaultPref("remote.experimental.dynamicstart.banner.enabled", false);
  defaultPref("remote.experimental.dynamicstart.connectionbanner.enabled", false);

  (function () {
    // The autoconfig scope only has Services; import the rest.
    Components.utils.importGlobalProperties(["ChromeUtils", "IOUtils", "PathUtils"]);
    const PORT = 9222; // the port Firefox uses for a runtime start
    const IDLE_MS = 2 * 60 * 1000;
    const runtime = Services.env.get("XDG_RUNTIME_DIR");
    if (!runtime) {
      return;
    }
    const dir = PathUtils.join(runtime, "firefox-agent-bridge", "active");
    let busy = false;

    async function wanted() {
      let paths;
      try {
        paths = await IOUtils.getChildren(dir);
      } catch (_) {
        return false;
      }
      let want = false;
      for (const path of paths) {
        const pid = PathUtils.filename(path);
        let alive = false;
        let fresh = false;
        try {
          alive = /^\d+$/.test(pid) && (await IOUtils.exists(`/proc/${pid}`));
          fresh = Date.now() - (await IOUtils.stat(path)).lastModified < IDLE_MS;
        } catch (_) {}
        if (!alive) {
          await IOUtils.remove(path).catch(() => {});
        } else if (fresh) {
          want = true;
        }
      }
      return want;
    }

    // RemoteAgent force-quits Firefox when it cannot bind its port, so only
    // start when the port is free (e.g. not taken by another Firefox).
    function portFree() {
      try {
        const s = Components.classes["@mozilla.org/network/server-socket;1"].createInstance(Components.interfaces.nsIServerSocket);
        s.init(PORT, true, -1);
        s.close();
        return true;
      } catch (_) {
        return false;
      }
    }

    async function tick() {
      if (busy) {
        return;
      }
      busy = true;
      try {
        const { RemoteAgent } = ChromeUtils.importESModule(
          "chrome://remote/content/components/RemoteAgent.sys.mjs"
        );
        const want = await wanted();
        if (want && !RemoteAgent.running && portFree()) {
          await RemoteAgent.startAtRuntime({ isBrowserAutomation: false });
        } else if (!want && RemoteAgent.isDynamicStartRunning) {
          await RemoteAgent.stopAtRuntime();
        }
      } catch (e) {
        Services.console.logStringMessage("firefox-agent-bridge.cfg: " + e);
      } finally {
        busy = false;
      }
    }

    const topic = "browser-idle-startup-tasks-finished";
    Services.obs.addObserver(function onIdle() {
      Services.obs.removeObserver(onIdle, topic);
      try {
        const { setInterval } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
        setInterval(tick, 2000);
        tick();
      } catch (e) {
        Services.console.logStringMessage("firefox-agent-bridge.cfg: " + e);
      }
    }, topic);
  })();
} catch (e) {
  // Never break Firefox startup.
}
